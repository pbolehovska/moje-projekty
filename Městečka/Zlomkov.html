let pool=[];for(let d=2;d<=16;d++)for(let n=1;n<d;n++)if(gcd(n,d)===1)pool.push([n,d]);pool=shuffle(pool).slice(0,15);

function renderCouncil({container,building,session,launchLevel}){
 dialog.classList.add('council-dialog');const abort=new AbortController();let level='easy',examples=[],done=new Set();const button=(text,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.addEventListener('click',fn,{signal:abort.signal});return b;};
 function menu(){container.innerHTML='<h3>Početní operace</h3><p>Vypočítej na papír, nezapomínej na přednosti.</p><div class="council-menu"></div>';for(const [key,label]of Object.entries(activityLevels.radnice))container.querySelector('.council-menu').append(button(label,()=>session.select(key,()=>start(key))));}
 function parse(text){const s=text.trim().replace(/−/g,'-');let m=s.match(/^(-?\d+)$/);if(m)return {n:Number(m[1]),d:1};m=s.match(/^(-?\d+)\s+(?:a\s*)?(\d+)\s*\/\s*(\d+)$/);if(m){const whole=Number(m[1]),n=Number(m[2]),d=Number(m[3]);if(!d||n>=d||CouncilMath.gcd(n,d)!==1)return null;return {n:whole*d+(m[1].startsWith('-')?-n:n),d};}m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/);if(m){const n=Number(m[1]),d=Number(m[2]);if(!d||CouncilMath.gcd(n,d)!==1)return null;return {n,d};}return null;}
 function fitExpressions(){container.querySelectorAll('.council-expression').forEach(el=>{el.style.fontSize='';const base=parseFloat(getComputedStyle(el).fontSize);const width=el.getBoundingClientRect().width-16;if(el.scrollWidth>width){el.style.fontSize=Math.max(12,base*width/el.scrollWidth)+'px';}});}
 window.addEventListener('resize',fitExpressions,{signal:abort.signal});
 function start(key){level=key;examples=CouncilMath.generate(level);done=new Set();session.start();container.innerHTML='<div class="council-bar"><strong></strong><span class="council-progress">Hotovo 0 / 15</span></div><p class="council-instruction">Vypočítej na papír, nezapomínej na přednosti. Výsledky doplňuj v libovolném pořadí. Čitatel napiš nad zlomkovou čáru, jmenovatel pod ni. Zlomek musí být v základním tvaru; u smíšeného čísla doplň i celou část vlevo.</p><div class="council-examples"></div>';container.querySelector('.council-bar strong').textContent=activityLevels.radnice[level];container.querySelector('.council-bar').append(button('Nové příklady',()=>start(level)));examples.forEach((example,i)=>{const card=document.createElement('article');card.className='council-example';const number=document.createElement('strong');number.className='council-number';number.textContent=i+1+'.';const expression=document.createElement('div');expression.className='council-expression';expression.innerHTML=example.html;const fields=document.createElement('div');fields.className='council-entry';const whole=document.createElement('input');whole.type='text';whole.inputMode='numeric';whole.className='council-whole';whole.setAttribute('aria-label','Celá část příkladu '+(i+1));whole.placeholder='celá';const stack=document.createElement('div');stack.className='council-entry-fraction';const input=document.createElement('input');input.type='text';input.inputMode='numeric';input.className='council-input';input.setAttribute('aria-label','Čitatel výsledku příkladu '+(i+1));input.placeholder='čitatel';const denominator=document.createElement('input');denominator.type='text';denominator.inputMode='numeric';denominator.className='council-input';denominator.setAttribute('aria-label','Jmenovatel výsledku příkladu '+(i+1));denominator.placeholder='jmenovatel';for(const field of [whole,input,denominator])field.autocomplete='off';stack.append(input,denominator);fields.append(whole,stack);const check=()=>{if(done.has(i))return;const n=input.value.trim(),d=denominator.value.trim(),w=whole.value.trim();const text=w?(n&&d?w+' a '+n+'/'+d:(!n&&!d?w:'')):(n&&d?n+'/'+d:'');const v=parse(text),correct=v&&v.n*example.value.d===example.value.n*v.d;if(correct){done.add(i);card.classList.remove('council-wrong');card.classList.add('council-correct');input.disabled=true;denominator.disabled=true;whole.disabled=true;confirm.disabled=true;confirm.textContent='✓';container.querySelector('.council-progress').textContent='Hotovo '+done.size+' / 15';if(done.size===15){if(session.learner)setTimeout(()=>{if(!abort.signal.aborted)session.finish();},700);else container.querySelector('.council-progress').textContent='Výborně! Všech 15 příkladů je správně.';}}return Boolean(correct);};const confirm=button('Ověřit',()=>{if(!check()){if(session.error())return;card.classList.add('council-wrong');input.setAttribute('aria-invalid','true');}});for(const field of [whole,input,denominator])field.addEventListener('input',()=>{card.classList.remove('council-wrong');input.removeAttribute('aria-invalid');check();},{signal:abort.signal});for(const field of [whole,input,denominator])field.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();confirm.click();}},{signal:abort.signal});card.append(number,expression,fields,confirm);container.querySelector('.council-examples').append(card);});fitExpressions();}

const ShopMath={gcd:FactoryMath.gcd,generate(level='easy'){const tasks=[],seen=new Set();while(tasks.length<15){let d=2+Math.floor(Math.random()*11),e=d;if(level==='medium'){const pairs=[[2,4],[2,6],[2,8],[2,10],[2,12],[3,6],[3,9],[3,12],[4,8],[4,12],[5,10],[6,12]];[d,e]=pairs[Math.floor(Math.random()*pairs.length)];if(Math.random()<.5)[d,e]=[e,d];}else if(level==='hard'){e=2+Math.floor(Math.random()*11);while(e===d)e=2+Math.floor(Math.random()*11);}const n=1+Math.floor(Math.random()*d),m=1+Math.floor(Math.random()*e);let a={n,d},b={n:m,d:e};if(tasks.length%5===0&&level!=='easy'){const g=this.gcd(d,e);a={n:d/g,d};b={n:e/g,d:e};}const key=a.n+'/'+a.d+'|'+b.n+'/'+b.d;if(seen.has(key))continue;seen.add(key);tasks.push({a,b,relation:a.n*b.d<b.n*a.d?'<':a.n*b.d>b.n*a.d?'>':'='});}return tasks;}};

 function menu(){container.innerHTML='<section class="cinema-menu"><span aria-hidden="true">🎬</span><h3>Zlomky na číselné ose</h3><p>Vyber obtížnost.</p><div></div></section>';for(const [id,label]of [['easy','Lehká'],['medium','Střední'],['hard','Těžká']])container.querySelector('.cinema-menu>div').append(button(label,()=>session.select(id,()=>start(id))));}
 function start(id){level=id;index=0;tasks=CinemaMath.generate(level);session.start();render();}
 function render(){solved=false;position=null;dragId=null;const t=tasks[index],count=(t.max-t.min)*t.divisions;container.innerHTML='<strong class="cinema-progress">Snímek '+(index+1)+' / 15</strong><h3>Umísti zlomek na číselnou osu.</h3><p>Klikni na filmový pás nebo přesuň značku prstem. Odpověď se vyhodnotí hned po umístění značky.</p><div class="cinema-prompt"><span aria-hidden="true">🎞️</span><span class="cinema-fraction"><span>'+t.n+'</span><span>'+t.d+'</span></span></div><div class="cinema-film"></div><div class="cinema-movement"></div><p class="cinema-status" role="status">Vyber místo na ose.</p><div class="cinema-controls"></div>';let ticks='';for(let i=0;i<=count;i++){const x=70+i/count*860,major=i%t.divisions===0;ticks+='<path d="M'+x+' '+(major?83:94)+'v'+(major?58:36)+'" stroke="#fff6d6" stroke-width="'+(major?3:1.5)+'"/>'+(major?'<text x="'+x+'" y="172" text-anchor="middle" fill="#fff6d6" font-size="27" font-weight="700">'+(t.min+i/t.divisions)+'</text>':'');}let holes='';for(let x=18;x<1000;x+=40)holes+='<rect x="'+x+'" y="14" width="22" height="18" rx="4" fill="#f6f5ee"/><rect x="'+x+'" y="198" width="22" height="18" rx="4" fill="#f6f5ee"/>';container.querySelector('.cinema-film').innerHTML='<svg viewBox="0 0 1000 230" aria-label="Filmový pás s číselnou osou od '+t.min+' do '+t.max+'"><rect width="1000" height="230" rx="20" fill="#243c40"/>'+holes+'<path d="M55 112H950l-14-8m14 8-14 8" fill="none" stroke="#fff6d6" stroke-width="3"/>'+ticks+'<g class="cinema-marker" style="display:none"><path d="M0 45v66" stroke="#f7bd54" stroke-width="5"/><circle cy="112" r="12" fill="#f7bd54" stroke="#fff" stroke-width="3"/><path d="M-16 44h32l-16 18Z" fill="#f7bd54"/></g></svg>';const svg=container.querySelector('svg');const setFromPointer=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000;setPosition(Math.round((x-70)/860*count));};on(svg,'pointerdown',e=>{if(solved||e.button!==0)return;e.preventDefault();dragId=e.pointerId;svg.setPointerCapture(e.pointerId);setFromPointer(e);});on(svg,'pointermove',e=>{if(dragId===e.pointerId){e.preventDefault();setFromPointer(e);}});on(svg,'pointerup',e=>{if(dragId===e.pointerId){dragId=null;verify();}});on(svg,'pointercancel',()=>dragId=null);const left=button('←',()=>{setPosition((position??Math.round(count/2))-1);verify();}),right=button('→',()=>{setPosition((position??Math.round(count/2))+1);verify();});left.setAttribute('aria-label','Posunout značku doleva');right.setAttribute('aria-label','Posunout značku doprava');const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=count;slider.step=1;slider.value=Math.round(count/2);slider.setAttribute('aria-label','Umístění značky na číselné ose');on(slider,'input',()=>setPosition(Number(slider.value)));on(slider,'change',verify);container.querySelector('.cinema-movement').append(left,slider,right);}
 function setPosition(value){if(solved)return;const t=tasks[index],count=(t.max-t.min)*t.divisions;position=Math.max(0,Math.min(count,value));container.querySelector('.cinema-marker').style.display='';container.querySelector('.cinema-marker').setAttribute('transform','translate('+(70+position/count*860)+' 0)');const slider=container.querySelector('input');slider.value=position;slider.setAttribute('aria-valuetext','Dílek '+position+' z '+count);container.querySelector('.cinema-film').classList.remove('cinema-wrong');container.querySelector('.cinema-status').textContent='Přesouváš značku na ose.';}
 function verify(){if(solved)return;if(position===null){container.querySelector('.cinema-status').textContent='Nejprve vyber místo na ose.';return;}const t=tasks[index];if(position!==t.n*t.divisions/t.d-t.min*t.divisions){if(session.error())return;container.querySelector('.cinema-film').classList.add('cinema-wrong');container.querySelector('.cinema-status').textContent='Ještě to není správně. Spočítej dílky od nuly a přesuň značku.';return;}solved=true;container.querySelector('.cinema-film').classList.add('cinema-correct');container.querySelectorAll('.cinema-movement button,.cinema-movement input').forEach(el=>el.disabled=true);container.querySelector('.cinema-status').textContent='Správně! Zlomek má své místo na filmovém pásu.';container.querySelector('.cinema-controls').replaceChildren(button(index===14?'Dokončit':'Další snímek',()=>{index++;if(index<15)render();else if(!session.finish()){container.innerHTML='<section class="cinema-menu"><h3>Výborně! Všech 15 snímků je na správném místě.</h3></section>';container.firstChild.append(button('Hrát znovu',()=>start(level)));}}));}
 menu();if(launchLevel)start(launchLevel);return()=>{abort.abort();dialog.classList.remove('cinema-dialog');};
}
TownApp.registerComponent('cinema',renderCinema);
TownApp.configureBuilding('kino',{active:true,activity:{name:'Zlomky na číselné ose'},component:'cinema'});
if(directGame&&activityLevels[directGame]?.[directLevel]){setMode('student');openBuilding(directGame,directLevel);}
</script>
