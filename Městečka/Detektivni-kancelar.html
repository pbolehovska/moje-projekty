ns:repeat(2,minmax(0,1fr));gap:8px}.field{display:block;font-weight:750;margin:18px 0 7px}input[type=text],textarea{display:block;width:100%;border:1.5px solid #b2c6b7;border-radius:11px;padding:11px;color:#173f45}textarea{height:115px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{background:#e8f1e4;padding:14px;border-radius:12px;margin:12px 0;line-height:1.55}.warn{background:#fff1d9}.score{font-size:26px;font-weight:800}.check{display:flex;gap:10px;align-items:center;padding:13px;border-radius:11px;background:#e8f1e4}.check input{width:20px;height:20px}.tasktype{font-size:12px;font-weight:800;letter-spacing:1px;color:#698176}.small{font-size:13px;color:#58746a}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.summary{padding:8px 0;border-bottom:1px solid #e2e9df}.summary p{margin:5px 0}.bad{color:#a34035}.good{color:#276b42}@media(max-width:650px){body{padding:8px}.menu{grid-template-columns:1fr}.level{min-height:85px}.box{padding:12px}.types{grid-template-columns:1fr}.step{font-size:17px;min-height:70px;padding:8px}}

</style></head><body><main class="layout" id="root"></main><script>
'use strict';
const root=document.querySelector('#root');
const params=new URLSearchParams(location.search);
const mode=['class','student','test'].includes(params.get('mode'))?params.get('mode'):'class';
const modeName={class:'TŘÍDA',student:'ŽÁK',test:'TEST'}[mode];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const fraction=(n,d)=>'[['+n+'/'+d+']]';
const mixed=(w,n,d)=>'[['+w+';'+n+'/'+d+']]';
const reduce=(n,d)=>{let g=gcd(n,d);return[n/g,d/g]};
const math=(s)=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replace(/\[\[(\d+);(\d+)\/(\d+)\]\]/g,(_,w,n,d)=>'<span class="mixed">'+w+'<span class="fraction"><span class="n">'+n+'</span><span class="d">'+d+'</span></span></span>').replace(/\[\[([\d ×+:−]+)\/([\d ×+:−]+)\]\]/g,(_,n,d)=>'<span class="fraction"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>');
const labels={convert:'Nesprávný převod smíšeného čísla',expand:'Chybné rozšíření zlomku',add:'Chyba při sčítání či odčítání',denominator:'Nesprávná práce se jmenovateli',reduce:'Chybné krácení',decimal:'Chybný převod desetinného čísla',units:'Chyba při převodu jednotek',arithmetic:'Početní chyba v násobení či dělení',compare:'Chybné porovnání'};
const instructions = {
 convert: 'Převeď smíšené číslo na nepravý zlomek.',
 add: 'Sečti zlomky.',
 expand: 'Sečti zlomky s různými jmenovateli.',
 decimal: 'Zapiš desetinné číslo jako zlomek.',
 units: 'Převeď na uvedenou jednotku.',
 reduce: 'Zkrať zlomek na základní tvar.'
};
const assignmentMath = task => math(task.steps[0] + (task.targetUnit ? ' → ' + task.targetUnit : ''));
const decimal=x=>String(x).replace('.',',');
const mk=(steps,category,correction,explanation)=>({steps,category,correction,explanation});
function generate(level){
 const out=[];const scale={easy:1,medium:2,hard:3}[level];
 for(let i=0;i<4;i++){
   let w=2+scale+i,d=[4,5,8,6][i],n=[3,2,5,5][i],a=w*d+n,incorrect=a+(i%2?2:1);
   out.push(mk([mixed(w,n,d),fraction(i===3?a:incorrect,d),fraction(i===0||i===3?a:incorrect,d)],i===3?null:'convert',fraction(a,d),'Při převodu na nepravý zlomek vynásobíme celou část jmenovatelem a přičteme čitatele. '+w+' × '+d+' + '+n+' = '+a+'.'));
 }
 for(let i=0;i<4;i++){
   let d=[12,16,18,20][i]+(scale-1)*4,n=5+i*2,m=3+i*2,tot=n+m,wrong=tot+(i===3?0:1);
   let result=reduce(tot,d);
   out.push(mk([fraction(n,d)+' + '+fraction(m,d),fraction(wrong,d),fraction(i===3?result[0]:reduce(wrong,d)[0],i===3?result[1]:reduce(wrong,d)[1])],i===3?null:'add',fraction(...result),'Při sčítání stejných jmenovatelů sečteme pouze čitatele: '+n+' + '+m+' = '+tot+'.'));
 }
 for(let i=0;i<4;i++){
   let d=[6,8,10,12][i],a=[2,3,3,5][i],b=[1,3,1,5][i],big=d*2;
   let correctA=a*2, badA=correctA+(i===3?0:1),sum=badA+b,rr=reduce(sum,big);
   out.push(mk([fraction(a,d)+' + '+fraction(b,big),fraction(badA,big)+' + '+fraction(b,big),fraction(sum,big),fraction(rr[0],rr[1])],i===3?null:'expand',fraction(...reduce(correctA+b,big)),'Při rozšiřování na společného jmenovatele musí být čitatel i jmenovatel násobeny stejným číslem. Správně '+a+' × 2 = '+correctA+'.'));
 }
 for(let i=0;i<4;i++){
   const nums=[125,375,625,875],n=nums[i]+(scale-1)*100,raw=n/1000;
   let r=reduce(n,1000),wrong=n+(i===3?0:25);
   out.push(mk([decimal(raw),fraction(wrong,1000),fraction(i===3?r[0]:reduce(wrong,1000)[0],i===3?r[1]:reduce(wrong,1000)[1])],i===3?null:'decimal',fraction(...r),'Číslo se třemi desetinnými místy se zapíše jako počet tisícin: '+n+'/1000. Pak se zlomek zkrátí.'));
 }
 for(let i=0;i<4;i++){
   let num=[3,5,7,9][i],den=10,base=[100,60,100,100][i],unit=[['m','cm'],['h','min'],['m²','dm²'],['m','cm']][i],proper=(num*base/den),wrong=proper+(i===3?0:(i+1)*2);
   let conversion=fraction(num,den)+' '+unit[0];
   out.push(mk([conversion,decimal(num/den)+' '+unit[0],wrong+' '+unit[1]],i===3?null:'units',proper+' '+unit[1],'Nejdřív převedeme jednotku na '+base+' menších jednotek a výsledek vynásobíme čitatelem a vydělíme jmenovatelem. Správně je '+proper+' '+unit[1]+'.'));
 }
 for(let i=0;i<4;i++){
   let d=[15,24,28,36][i],n=[9,15,21,25][i],k=scale+i+2,x=n*k,y=d*k,r=reduce(n,d);
   if(i===0){
     // Konečný výsledek je správně, ale jeden mezikrok má jinou hodnotu.
     out.push(mk([fraction(x,y),fraction(n+1,d),fraction(r[0],r[1])],'reduce',fraction(...r),'Při krácení dělíme čitatele i jmenovatele stejným číslem. Prostřední zlomek nemá stejnou hodnotu.'));
   }else if(i===1){
     let sum=5+scale;
     out.push(mk([fraction(sum*10,100),fraction(sum+1,10),fraction(...reduce(sum+1,10))],'reduce',fraction(...reduce(sum,10)),'Prostřední zlomek nemá stejnou hodnotu jako první. Poslední zlomek je zkrácením nesprávného mezikroku.'));
   }else if(i===2){
     out.push(mk([fraction(x,y),fraction(n-1,d),fraction(n-1,d)],'reduce',fraction(...r),'Čitatele a jmenovatele je třeba dělit stejným číslem. Prostřední hodnota není původní zlomek.'));
   }else{
     out.push(mk([fraction(x,y),fraction(n,d),fraction(r[0],r[1])],null,'','Všechny zlomky mají stejnou hodnotu; krácení je správné.'));
   }
 }
 // Osmnáct chybných a šest správných úloh. Z chybných mají dvě úmyslně správný konečný výsledek.
 // Závěrečné úlohy jsou opravovány tak, aby byla chyba jen tam, kde má být.
 // Přesný poměr: 4 rodiny po 3 chybných, pátá po 3, šestá po 3 = 18; 6 bez chyby.
 const kinds = Object.keys(instructions);
 return out.map((t,i)=>({
   ...t,
   id:level+'-'+(i+1),
   instruction:instructions[kinds[Math.floor(i/4)]],
   targetUnit:i>=16&&i<20?['cm','min','dm²','cm'][i-16]:null,
   camouflage:i===0||i===20
 }));
}
const pool={easy:generate('easy'),medium:generate('medium'),hard:generate('hard')};
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}
let current=null,level=null,tasks=[],index=0,answers=[],selected='',choice='',fix='',countErrors=0,submitted=false;
function pick(l){const arr=pool[l],cam=arr.filter(t=>t.camouflage),wrong=arr.filter(t=>t.category&&!t.camouflage),good=arr.filter(t=>!t.category);return shuffle([...cam,...shuffle(wrong).slice(0,10),...shuffle(good).slice(0,3)]);}
function menu(){root.innerHTML='<div class="head"><div><div class="tasktype">ZLOMKOV · '+modeName+'</div><h1>🕵️ Detektivní kancelář</h1><p class="minor">Prozkoumej každý krok výpočtu. Správný výsledek nemusí znamenat správný postup.</p></div></div><div class="menu">'+[['easy','Lehká','Smíšená čísla, desetinná čísla, sčítání a převody'],['medium','Střední','Vícekrokové postupy, zlomky a jednotky'],['hard','Těžká','Větší čísla a důmyslné početní omyly']].map(([id,n,h])=>'<button class="level" data-level="'+id+'">🔎<b>'+n+'</b><small>'+h+'</small></button>').join('')+'</div><p class="minor">Režim TŘÍDA: společná kontrola. ŽÁK: individuální zpětná vazba. TEST: vyhodnocení až po dokončení.</p>';root.querySelectorAll('[data-level]').forEach(x=>x.addEventListener('click',()=>start(x.dataset.level)));}
function start(l){level=l;tasks=pick(l);index=0;answers=[];selected='';choice='';fix='';countErrors=0;submitted=false;show();}
function show(){if(index>=tasks.length){summary();return;}current=tasks[index];selected='';choice='';fix='';submitted=false;render();}
function equation(){
 const parts = [];
 current.steps.forEach((value,i)=>{
   if(i>0&&value===current.steps[i-1]) return;
   parts.push({value,key:String(i)});
 });
 return parts.map(({value,key},i)=>
   '<span class="equation-part">'+(i?'<span class="eq">=</span>':'')+
   '<button class="step" type="button" data-step="'+key+'" aria-pressed="'+(selected===key)+'">'+math(value)+'</button></span>'
 ).join('');
}
// Vrací přesný poměr celých čísel, aby se desetinné zápisy nezaokrouhlovaly.
function resultValue(input){
 const value=input.trim().replaceAll('−','-').replaceAll(',','.');
 const mixedValue=value.match(/^([+-]?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
 if(mixedValue){
   const [,sign,whole,part,bottom]=mixedValue;
   const denominator=BigInt(bottom);
   if(!denominator||BigInt(part)>=denominator) return null;
   const numerator=BigInt(whole)*denominator+BigInt(part);
   return [sign==='-'?-numerator:numerator,denominator];
 }
 const decimalValue=value.match(/^([+-]?\d+)(?:\.(\d+))?$/);
 if(decimalValue){
   const [,whole,places='']=decimalValue;
   return [BigInt(whole+places),10n**BigInt(places.length)];
 }
 if(value.startsWith('(')&&value.endsWith(')')){
   // Vnější závorky lze odebrat pouze tehdy, když obalují celý výraz.
   let depth=0;
   const closesEarly=Array.from(value.slice(0,-1)).some(char=>{
     if(char==='(') depth++;
     if(char===')') depth--;
     return depth===0;
   });
   if(!closesEarly) return resultValue(value.slice(1,-1));
 }
 let depth=0, divider=-1;
 for(let i=0;i<value.length;i++){
   if(value[i]==='(') depth++;
   if(value[i]===')') depth--;
   if(depth<0) return null;
   if(value[i]==='/'&&depth===0){
     if(divider!==-1) return null;
     divider=i;
   }
 }
 if(depth!==0||divider===-1) return null;
 const top=resultValue(value.slice(0,divider));
 const bottom=resultValue(value.slice(divider+1));
 if(!top||!bottom||bottom[0]===0n) return null;
 return [top[0]*bottom[1],top[1]*bottom[0]];
}
function correctResult(task, input){
 if(input.length>80) return false;
 const unit=task.targetUnit;
 const normalized=input.trim().replace(/([a-z])(?:\^2|2)$/i,'$1²');
 const given=unit&&normalized.endsWith(unit)?normalized.slice(0,-unit.length):normalized;
 const expected=unit?task.correction.slice(0,-unit.length):task.correction.replace(/^\[\[|\]\]$/g,'');
 const a=resultValue(given), b=resultValue(expected);
 return Boolean(a&&b&&a[0]*b[1]===b[0]*a[1]);
}
function render(){
 const isGood = selected==='correct';
 const hasError = current.category && selected===String(firstBadIndex(current));
 const mayCorrect = hasError && choice===current.category;
 root.innerHTML=`
   <div class="head">
     <div><div class="tasktype">DETEKTIVNÍ KANCELÁŘ · ${modeName} · ${{easy:'Lehká',medium:'Střední',hard:'Těžká'}[level]}</div>
       <h2>Případ ${index+1} z 15</h2></div>
     <button id="back" class="soft">← Výběr obtížnosti</button>
   </div>
   <div class="progress"><div class="bar" style="width:${Math.round(index/15*100)}%"></div></div>
   <section class="box assignment equation" aria-label="Příklad a výpočet">${equation()}</section>
   <label class="check"><input id="correct" type="checkbox" ${isGood?'checked':''}><span>Celý postup je správný</span></label>
   <p class="minor" id="selection-feedback" role="status"></p>
   ${hasError?'<fieldset class="box error-types"><legend>V čem je chyba?</legend><div class="types">'+Object.entries(labels).map(([key,label])=>
     '<label class="type"><input type="radio" name="error-type" data-type="'+key+'" '+(choice===key?'checked':'')+'> '+label+'</label>'
   ).join('')+'</div><p class="minor" id="type-feedback" role="status">'+(choice&&!mayCorrect?'Zkus jinou možnost.':'')+'</p></fieldset>':''}
   ${isGood||mayCorrect?
     '<section class="box answer-fields">'+(mayCorrect?'<label class="field" for="fix">Správný výsledek'+(current.targetUnit?' v '+current.targetUnit:'')+'</label><input id="fix" type="text" autocomplete="off" maxlength="80" aria-describedby="result-hint result-feedback"><p class="minor" id="result-hint">'+(current.targetUnit?'Zadej hodnotu v uvedené jednotce.':'Například 3/4, 0,75, 2 1/3 nebo (1/2)/(3/4).')+'</p><p class="bad" id="result-feedback" role="status"></p>':'')+
     '<div class="controls"><button class="primary" id="submit" disabled>Odevzdat odpověď</button></div></section>':''}
   <div id="feedback"></div>`;
 root.querySelector('#back').onclick=menu;
 root.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{
   if(!current.category||button.dataset.step!==String(firstBadIndex(current))){
     root.querySelector('#selection-feedback').textContent='Zkus jiné místo ve výpočtu.';
     return;
   }
   if(hasError) return;
   selected=button.dataset.step;
   render();
   root.querySelector('[data-type]')?.focus({preventScroll:true});
 });
 root.querySelector('#correct').onchange=event=>{
   if(current.category){
     event.target.checked=false;
     root.querySelector('#selection-feedback').textContent='V postupu je chyba.';
     return;
   }
   selected=event.target.checked?'correct':'';
   render();
   root.querySelector(isGood?'#correct':'#submit')?.focus({preventScroll:true});
 };
 root.querySelectorAll('[data-type]').forEach(option=>option.onchange=()=>{
   choice=option.dataset.type;
   render();
   root.querySelector(choice===current.category?'#fix':'[data-type="'+choice+'"]')?.focus({preventScroll:true});
 });
 const inp=root.querySelector('#fix'), btn=root.querySelector('#submit');
 if(!btn) return;
 function updateSubmit(){
   btn.disabled=!(isGood||fix.trim());
 }


 if(inp){
   inp.value=fix;
   inp.oninput=()=>{fix=inp.value;inp.removeAttribute('aria-invalid');root.querySelector('#result-feedback').textContent='';updateSubmit();};
 }
 updateSubmit();
 btn.onclick=submit;
}
function submit(){
 if(submitted)return;
 const located=(current.category===null?selected==='correct':selected===String(firstBadIndex(current)));
 const typed=(!current.category&&selected==='correct')||(current.category&&choice===current.category);
 if(!located||!typed) return;
 if(current.category&&!correctResult(current,fix)){
   const input=root.querySelector('#fix');
   input.setAttribute('aria-invalid','true');
   root.querySelector('#result-feedback').textContent='Výsledek nesouhlasí. Zkontroluj hodnotu a zkus to znovu.';
   input.focus();
   return;
 }
 submitted=true;
 const correct=true;
 const data={id:current.id,steps:current.steps,instruction:current.instruction,targetUnit:current.targetUnit,located,typed,choice,selected,fix,category:current.category,correction:current.correction,explanation:current.explanation,correct};
 answers.push(data);
 if(!correct)countErrors++;
 const fb=root.querySelector('#feedback');
 fb.innerHTML=(mode==='test'?'<div class="notice">Odpověď uložena. Vyhodnocení se zobrazí po dokončení všech 15 případů.</div>':'<div class="notice '+(correct?'':'warn')+'"><b>'+(correct?'Místo a typ jsou správně.':'Tvoje označení není úplně správně.')+'</b><p>'+(current.category?'První chybný krok je číslo '+(firstBadIndex(current))+'. Typ: '+labels[current.category]+'.':'Celý postup je správný.')+'</p><p>'+current.explanation+'</p>'+(current.category?'<p>Správný výsledek: <b>'+math(current.correction)+'</b></p>':'')+'<p class="minor">Svůj výsledek můžeš porovnat se vzorem.</p></div>');
 const next=document.createElement('button');next.className='primary';next.textContent=index===14?'Zobrazit vyhodnocení':'Další případ →';next.onclick=()=>{index++;show()};fb.append(next);
 root.querySelectorAll('.step,[data-type],#correct,#fix,#submit').forEach(x=>x.disabled=true);
 if(mode==='student'&&countErrors>=5){const note=document.createElement('p');note.className='notice warn';note.textContent='Pět nesprávně označených případů. Podle pravidel režimu ŽÁK můžeš začít nové kolo.';fb.append(note);}
}
function firstBadIndex(t){
 // V generovaných chybných případech je první chybný člen druhý, s výjimkou jednotek,
 // kde je chybný výsledek až ve třetím členu.
 return t.category==='units'?2:1;
}
function summary(){
 const scored=answers.filter(a=>a.correct).length;
 root.innerHTML='<div class="box"><div class="tasktype">DETEKTIVNÍ KANCELÁŘ · '+modeName+'</div><h1>Vyšetřování dokončeno</h1><div class="score">'+scored+' / 15</div><p>Zkontrolováno bylo místo a druh chyby i opravený výsledek.</p><div class="controls"><button class="primary" id="again">Nová sada 15 případů</button><button class="soft" id="levels">Změnit obtížnost</button><button class="soft" id="print">Vytisknout přehled</button></div><h2>Protokol případů</h2>'+answers.map((a,i)=>'<div class="summary"><b>'+(i+1)+'. '+(a.correct?'✓':'✗')+' '+(a.category?labels[a.category]:'Bez chyby')+'</b><p>'+a.instruction+' <span class="math">'+assignmentMath(a)+'</span></p><p class="small">Postup <span class="math">'+math(a.steps[0])+a.steps.slice(1).map((value,i)=>value===a.steps[i]?'':' = '+math(value)).join('')+'</span></p>'+(a.fix?'<p><b>Výsledek žáka:</b> '+escapeHTML(a.fix)+'</p>':'')+'<p><b>Vzor:</b> '+a.explanation+(a.category?' Správně: '+math(a.correction):'')+'</p></div>').join('')+'</div>';
 root.querySelector('#again').onclick=()=>start(level);
 root.querySelector('#levels').onclick=menu;
 root.querySelector('#print').onclick=()=>window.print();
 try{localStorage.setItem('zlomkov-detektiv-posledni',JSON.stringify({date:new Date().toISOString(),level,mode,answers}));}catch(e){}
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
menu();
</script></body></html>
