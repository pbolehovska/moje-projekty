'use strict';
const root=document.querySelector('#root');
const params=new URLSearchParams(location.search);
const mode=['class','student','test'].includes(params.get('mode'))?params.get('mode'):'class';
const modeName={class:'TŘÍDA',student:'ŽÁK',test:'TEST'}[mode];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const fraction=(n,d)=>'[['+n+'/'+d+']]';
const mixed=(w,n,d)=>'[['+w+';'+n+'/'+d+']]';
const reduce=(n,d)=>{let g=gcd(n,d);return[n/g,d/g]};
const math=(s)=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replace(/\[\[(\d+);(\d+)\/(\d+)\]\]/g,(_,w,n,d)=>'<span class="mixed">'+w+'<span class="fraction"><span class="n">'+n+'</span><span class="d">'+d+'</span></span></span>').replace(/\[\[([\d ×+:−]+)\/([\d ×+:−]+)\]\]/g,(_,n,d)=>'<span class="fraction"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>');
const labels={convert:'Nesprávný převod smíšeného čísla',expand:'Chybné rozšíření zlomku',add:'Chyba při sčítání či odčítání',denominator:'Nesprávná práce se jmenovateli',reduce:'Chybné krácení',decimal:'Chybný převod desetinného čísla',units:'Chyba při převodu jednotek',arithmetic:'Početní chyba v násobení či dělení',compare:'Chybné porovnání'};
const instructions = {
 convert: 'Převeď smíšené číslo na nepravý zlomek.',
 add: 'Sečti zlomky.',
 expand: 'Sečti zlomky s různými jmenovateli.',
 decimal: 'Zapiš desetinné číslo jako zlomek.',
 units: 'Převeď na uvedenou jednotku.',
 reduce: 'Zkrať zlomek na základní tvar.'
};
const assignmentMath = task => math(task.steps[0] + (task.targetUnit ? ' → ' + task.targetUnit : ''));
const decimal=x=>String(x).replace('.',',');
const mk=(steps,category,correction,explanation,intermediate=[])=>({steps,category,correction,explanation,intermediate});
function generate(level, variant){
 const out=[];const scale={easy:1,medium:2}[level]+variant*2;
 for(let i=0;i<4;i++){
   let w=2+scale+i,d=[4,5,8,6][i],n=[3,2,5,5][i],a=w*d+n,incorrect=a+(i%2?2:1);
   out.push(mk([mixed(w,n,d),fraction(i===3?a:incorrect,d),fraction(i===0||i===3?a:incorrect,d)],i===3?null:'convert',fraction(a,d),'Při převodu na nepravý zlomek vynásobíme celou část jmenovatelem a přičteme čitatele. '+w+' × '+d+' + '+n+' = '+a+'.',i===0?[fraction(a,d)]:[]));
 }
 for(let i=0;i<4;i++){
   let d=[12,16,18,20][i]+(scale-1)*4,n=5+i*2,m=3+i*2,tot=n+m,wrong=tot+(i===3?0:1);
   let result=reduce(tot,d);
   out.push(mk([fraction(n,d)+' + '+fraction(m,d),fraction(wrong,d),fraction(i===3?result[0]:reduce(wrong,d)[0],i===3?result[1]:reduce(wrong,d)[1])],i===3?null:'add',fraction(...result),'Při sčítání stejných jmenovatelů sečteme pouze čitatele: '+n+' + '+m+' = '+tot+'.',[fraction(tot,d)]));
 }
 for(let i=0;i<4;i++){
   let d=[6,8,10,12][i]+variant*2,a=[2,3,3,5][i]+variant,b=[1,3,1,5][i]+variant,big=d*2;
   let correctA=a*2, badA=correctA+(i===3?0:1),sum=badA+b,rr=reduce(sum,big);
   out.push(mk([fraction(a,d)+' + '+fraction(b,big),fraction(badA,big)+' + '+fraction(b,big),fraction(sum,big),fraction(rr[0],rr[1])],i===3?null:'expand',fraction(...reduce(correctA+b,big)),'Při rozšiřování na společného jmenovatele musí být čitatel i jmenovatel násobeny stejným číslem. Správně '+a+' × 2 = '+correctA+'.',[fraction(correctA,big)+' + '+fraction(b,big),fraction(correctA+b,big)]));
 }
 for(let i=0;i<4;i++){
   const nums=[125,375,625,875],n=nums[i]+(scale-1)*100,raw=n/1000;
   let r=reduce(n,1000),wrong=n+(i===3?0:25);
   out.push(mk([decimal(raw),fraction(wrong,1000),fraction(i===3?r[0]:reduce(wrong,1000)[0],i===3?r[1]:reduce(wrong,1000)[1])],i===3?null:'decimal',fraction(...r),'Číslo se třemi desetinnými místy se zapíše jako počet tisícin: '+n+'/1000. Pak se zlomek zkrátí.',[fraction(n,1000)]));
 }
 for(let i=0;i<4;i++){
   let num=[3,5,7,9][i]+variant*2,den=10,base=[100,60,100,100][i],unit=[['m','cm'],['h','min'],['m²','dm²'],['m','cm']][i],proper=(num*base/den),wrong=proper+(i===3?0:(i+1)*2);
   let conversion=fraction(num,den)+' '+unit[0];
   out.push(mk([conversion,decimal(num/den)+' '+unit[0],wrong+' '+unit[1]],i===3?null:'units',proper+' '+unit[1],'Nejdřív převedeme jednotku na '+base+' menších jednotek a výsledek vynásobíme čitatelem a vydělíme jmenovatelem. Správně je '+proper+' '+unit[1]+'.'));
 }
 for(let i=0;i<4;i++){
   let d=[15,24,28,36][i],n=[9,15,21,25][i],k=scale+i+2,x=n*k,y=d*k,r=reduce(n,d);
   if(i===0){
     // Konečný výsledek je správně, ale jeden mezikrok má jinou hodnotu.
     out.push(mk([fraction(x,y),fraction(n+1,d),fraction(r[0],r[1])],'reduce',fraction(...r),'Při krácení dělíme čitatele i jmenovatele stejným číslem. Prostřední zlomek nemá stejnou hodnotu.',[fraction(n,d)]));
   }else if(i===1){
     let sum=5+scale;
     out.push(mk([fraction(sum*10,100),fraction(sum+1,10),fraction(...reduce(sum+1,10))],'reduce',fraction(...reduce(sum,10)),'Prostřední zlomek nemá stejnou hodnotu jako první. Poslední zlomek je zkrácením nesprávného mezikroku.',[fraction(sum,10)]));
   }else if(i===2){
     out.push(mk([fraction(x,y),fraction(n-1,d),fraction(n-1,d)],'reduce',fraction(...r),'Čitatele a jmenovatele je třeba dělit stejným číslem. Prostřední hodnota není původní zlomek.'));
   }else{
     out.push(mk([fraction(x,y),fraction(n,d),fraction(r[0],r[1])],null,'','Všechny zlomky mají stejnou hodnotu; krácení je správné.'));
   }
 }
 // Osmnáct chybných a šest správných úloh. Z chybných mají dvě úmyslně správný konečný výsledek.
 // Závěrečné úlohy jsou opravovány tak, aby byla chyba jen tam, kde má být.
 // Přesný poměr: 4 rodiny po 3 chybných, pátá po 3, šestá po 3 = 18; 6 bez chyby.
 const kinds = Object.keys(instructions);
 return out.map((t,i)=>({
   ...t,
   id:level+'-'+variant+'-'+(i+1),
   instruction:instructions[kinds[Math.floor(i/4)]],
   targetUnit:i>=16&&i<20?['cm','min','dm²','cm'][i-16]:null,
   camouflage:i===0||i===20
 }));
}
function hardCases(){
 const errors=[
   {step:1,type:'convert',explanation:'Při převodu smíšeného čísla vynásobíme celou část jmenovatelem a přičteme čitatele.'},
   {step:2,type:'expand',explanation:'Při rozšiřování násobíme čitatele i jmenovatele stejným číslem.'},
   {step:3,type:'add',explanation:'Při sčítání a odčítání zlomků se stejným jmenovatelem upravujeme čitatele.'},
   {step:4,type:'convert',explanation:'Při převodu na smíšené číslo je zbytek po dělení čitatelem zlomkové části.'}
 ];
 const triples=[[12,18,9],[8,12,6],[10,15,6],[14,21,6],[9,12,8],[6,10,15]];
 const lcm=(a,b)=>a*b/gcd(a,b);
 return Array.from({length:60},(_,i)=>{
   const denominators=triples[i%triples.length];
   const common=denominators.reduce(lcm);
   const variant=Math.floor(i/triples.length);
   const whole=[4+variant,2+(i%4),1+(variant%2)];
   const parts=denominators.map((d,j)=>1+(variant*(j+2)+i+j)%(d-1));
   const sign=variant%3===0?1:-1;
   const chain=items=>items[0]+' + '+items[1]+(sign===1?' + ':' − ')+items[2];
   const total=values=>values[0]+values[1]+sign*values[2];
   const start=chain(whole.map((w,j)=>mixed(w,parts[j],denominators[j])));
   const improper=whole.map((w,j)=>w*denominators[j]+parts[j]);
   const expanded=improper.map((n,j)=>n*common/denominators[j]);
   const sum=total(expanded);
   const asMixed=n=>{
     const [r,d]=reduce(n,common);
     const rest=r%d;
     return rest?mixed(Math.floor(r/d),rest,d):String(r/d);
   };
   const correct=[start,chain(improper.map((n,j)=>fraction(n,denominators[j]))),
     chain(expanded.map(n=>fraction(n,common))),fraction(sum,common),asMixed(sum)];
   const error=errors[i%5];
   const shown=correct.slice();
   const camouflage=Boolean(error&&error.step<4&&variant%3===0);
   if(error){
     const term=variant%3, delta=1+(i%3);
     let wrongSum=sum+delta;
     if(error.step===1||error.step===2){
       const wrongImproper=improper.slice();
       if(error.step===1){
         wrongImproper[term]+=delta;
         shown[1]=chain(wrongImproper.map((n,j)=>fraction(n,denominators[j])));
       }
       const wrongExpanded=wrongImproper.map((n,j)=>n*common/denominators[j]);
       if(error.step===2) wrongExpanded[term]+=delta;
       shown[2]=chain(wrongExpanded.map(n=>fraction(n,common)));
       wrongSum=total(wrongExpanded);
     }
     if(error.step<4) shown[3]=fraction(wrongSum,common);
     shown[4]=camouflage?correct[4]:asMixed(wrongSum);
   }
   return {
     id:'hard-'+(i+1),steps:shown,category:error?.type||null,badIndex:error?.step,
     correction:correct[4],intermediate:error?correct.slice(error.step,-1):[],
     explanation:error?.explanation||'Všechny členy řetězce mají stejnou hodnotu.',
     instruction:'Vypočítej a výsledek zapiš jako smíšené číslo nebo celé číslo.',camouflage
   };
 });
}
function extraCases(level){
 const offset=level==='medium'?5:0;
 return Array.from({length:16},(_,i)=>{
   const d=7+offset+i, n=2+i%4, m=1+i%3;
   const addDenominators=i%2===0;
   const correct=addDenominators?fraction(...reduce(n+m,d)):fraction(...reduce(n*m,d));
   return {
     id:level+'-extra-'+i,
     steps:[fraction(n,d)+(addDenominators?' + ':' × ')+(addDenominators?fraction(m,d):String(m)),
       addDenominators?fraction(n+m,2*d):fraction(n*m+1,d)],
     category:addDenominators?'denominator':'arithmetic',
     correction:correct,intermediate:[],
     explanation:addDenominators?'Při sčítání zlomků se stejným jmenovatelem zůstává jmenovatel stejný.':'Při násobení zlomku celým číslem vynásobíme čitatele.',
     instruction:addDenominators?'Sečti zlomky.':'Vynásob zlomek celým číslem.'
   };
 });
}
const pool={
 easy:[...extraCases('easy'),...[0,1,2].flatMap(variant=>generate('easy',variant))],
 medium:[...extraCases('medium'),...[0,1,2].flatMap(variant=>generate('medium',variant))],
 hard:hardCases()
};
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}
let stepEntries={};
let current=null,level=null,tasks=[],index=0,answers=[],selected='',choice='',fix='',countErrors=0,submitted=false;
const seenByLevel={easy:new Set(),medium:new Set(),hard:new Set()};
function pick(l){
 const seen=seenByLevel[l];
 const available=predicate=>{
   const candidates=shuffle(pool[l].filter(predicate));
   return [...candidates.filter(task=>!seen.has(task.id)),...candidates.filter(task=>seen.has(task.id))];
 };
 const camouflage=available(task=>task.camouflage).slice(0,2);
 const good=available(task=>!task.category).slice(0,3);
 const errors=available(task=>task.category&&!task.camouflage);
 const kinds=Object.keys(labels);
 const varied=kinds.map(kind=>errors.find(task=>task.category===kind)).filter(Boolean);
 const wrong=[...varied,...errors.filter(task=>!varied.includes(task))].slice(0,12-camouflage.length);
 const set=shuffle([...camouflage,...wrong,...good]);
 set.forEach(task=>seen.add(task.id));
 if(seen.size===pool[l].length) seen.clear();
 return set;
}
function menu(){root.innerHTML='<div class="head"><div><div class="tasktype">ZLOMKOV · '+modeName+'</div><h1>🕵️ Detektivní kancelář</h1><p class="minor">Prozkoumej každý krok výpočtu. Správný výsledek nemusí znamenat správný postup.</p></div></div><div class="menu">'+[['easy','Lehká','Smíšená čísla, desetinná čísla, sčítání a převody'],['medium','Střední','Vícekrokové postupy, zlomky a jednotky'],['hard','Těžká','Větší čísla a důmyslné početní omyly']].map(([id,n,h])=>'<button class="level" data-level="'+id+'">🔎<b>'+n+'</b><small>'+h+'</small></button>').join('')+'</div><p class="minor">Režim TŘÍDA: společná kontrola. ŽÁK: individuální zpětná vazba. TEST: vyhodnocení až po dokončení.</p>';root.querySelectorAll('[data-level]').forEach(x=>x.addEventListener('click',()=>start(x.dataset.level)));}
function start(l){level=l;tasks=pick(l);index=0;answers=[];selected='';choice='';fix='';countErrors=0;submitted=false;show();}
function show(){if(index>=tasks.length){summary();return;}current=tasks[index];stepEntries={};selected='';choice='';fix='';submitted=false;render();}
function equation(){
 const parts = [];
 current.steps.forEach((value,i)=>{
   if(i>0&&value===current.steps[i-1]) return;
   parts.push({value,key:String(i)});
 });
 return parts.map(({value,key},i)=>
   '<span class="equation-part">'+(i?'<span class="eq">=</span>':'')+
   '<button class="step" type="button" data-step="'+key+'" aria-pressed="'+(selected===key)+'">'+math(value)+'</button></span>'
 ).join('');
}
// Vrací přesný poměr celých čísel, aby se desetinné zápisy nezaokrouhlovaly.
function resultValue(input){
 const value=input.trim().replaceAll('−','-').replaceAll(',','.');
 const mixedValue=value.match(/^([+-]?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
 if(mixedValue){
   const [,sign,whole,part,bottom]=mixedValue;
   const denominator=BigInt(bottom);
   if(!denominator||BigInt(part)>=denominator) return null;
   const numerator=BigInt(whole)*denominator+BigInt(part);
   return [sign==='-'?-numerator:numerator,denominator];
 }
 const decimalValue=value.match(/^([+-]?\d+)(?:\.(\d+))?$/);
 if(decimalValue){
   const [,whole,places='']=decimalValue;
   return [BigInt(whole+places),10n**BigInt(places.length)];
 }
 if(value.startsWith('(')&&value.endsWith(')')){
   // Vnější závorky lze odebrat pouze tehdy, když obalují celý výraz.
   let depth=0;
   const closesEarly=Array.from(value.slice(0,-1)).some(char=>{
     if(char==='(') depth++;
     if(char===')') depth--;
     return depth===0;
   });
   if(!closesEarly) return resultValue(value.slice(1,-1));
 }
 let depth=0, divider=-1;
 for(let i=0;i<value.length;i++){
   if(value[i]==='(') depth++;
   if(value[i]===')') depth--;
   if(depth<0) return null;
   if(value[i]==='/'&&depth===0){
     if(divider!==-1) return null;
     divider=i;
   }
 }
 if(depth!==0||divider===-1) return null;
 const top=resultValue(value.slice(0,divider));
 const bottom=resultValue(value.slice(divider+1));
 if(!top||!bottom||bottom[0]===0n) return null;
 return [top[0]*bottom[1],top[1]*bottom[0]];
}
function correctResult(task, input){
 if(input.length>80) return false;
 const unit=task.targetUnit;
 const normalized=input.trim().replace(/([a-z])(?:\^2|2)$/i,'$1²');
 const given=unit&&normalized.endsWith(unit)?normalized.slice(0,-unit.length):normalized;
 const expected=unit?task.correction.slice(0,-unit.length):task.correction.replace(/^\[\[|\]\]$/g,'').replace(';',' ');
 const a=resultValue(given), b=resultValue(expected);
 return Boolean(a&&b&&a[0]*b[1]===b[0]*a[1]);
}
function repairSteps(task){
 if(!task.steps.slice(firstBadIndex(task)+1).some((value,i)=>value!==task.steps[firstBadIndex(task)+i])) return [];
 return task.intermediate.filter(step=>step!==task.correction);
}
function stepFields(task){
 return repairSteps(task).map((step,i)=>{
   const terms=step.split(/\[\[\d+\/\d+\]\]/g).slice(0,-1);
   return '<span class="eq" aria-hidden="true">=</span><div class="repair-equation" role="group" aria-label="Opravený krok '+(firstBadIndex(task)+i)+'">'+
     terms.map((operator,j)=>{
       const key=i+'-'+j;
       return escapeHTML(operator)+'<div class="result-fraction"><input type="text" inputmode="numeric" maxlength="30" aria-label="Čitatel zlomku '+(j+1)+'" data-repair="'+key+'-top"><span class="result-fraction-line" aria-hidden="true"></span><input type="text" inputmode="numeric" maxlength="30" aria-label="Jmenovatel zlomku '+(j+1)+'" data-repair="'+key+'-bottom"></div>';
     }).join('')+'</div>';
 }).join('');
}
function repairMatches(step,i){
 return [...step.matchAll(/\[\[(\d+)\/(\d+)\]\]/g)].every(([,top,bottom],j)=>
   BigInt(stepEntries[i+'-'+j+'-top'])===BigInt(top)&&BigInt(stepEntries[i+'-'+j+'-bottom'])===BigInt(bottom)
 );
}
function resultFields(task){
 const attributes='type="text" autocomplete="off" aria-describedby="result-hint result-feedback"';
 const fractionResult=task.correction.startsWith('[[');
 const mixedResult=task.correction.includes(';');
 const hint=mixedResult?'Doplň celou část, čitatele a jmenovatele.':fractionResult?'Doplň čitatele a jmenovatele.':task.targetUnit?'Zadej hodnotu v uvedené jednotce.':'Doplň celé číslo.';
 const inputs=fractionResult
   ?'<div class="result-fraction"><input id="fix" '+attributes+' inputmode="numeric" maxlength="30" aria-label="Čitatel"><span class="result-fraction-line" aria-hidden="true"></span><input id="fix-denominator" '+attributes+' inputmode="numeric" maxlength="30" aria-label="Jmenovatel"></div>'
   :'<input id="fix" '+attributes+' maxlength="80" aria-label="Správný výsledek'+(task.targetUnit?' v '+task.targetUnit:'')+'">';
 const steps=repairSteps(task);
 const prefix=task.steps.slice(0,firstBadIndex(task)).map(value=>'<span class="math">'+math(value)+'</span>').join('<span class="eq" aria-hidden="true">=</span>');
 return '<h3 class="field" id="result-title">'+(steps.length?'Opravený postup':'Správný výsledek')+(task.targetUnit?' v '+task.targetUnit:'')+'</h3>'+
   '<div class="repair-row"><div class="calculation-track">'+prefix+stepFields(task)+'<span class="eq" aria-hidden="true">=</span><div class="result-group" role="group" aria-label="Správný výsledek">'+(mixedResult?'<input id="fix-whole" '+attributes+' inputmode="numeric" maxlength="30" aria-label="Celá část">':'')+inputs+'</div></div></div>'+
   '<p class="minor" id="result-hint">'+hint+'</p>'+
   steps.map((_,i)=>'<p class="bad repair-feedback" id="repair-feedback-'+i+'" role="status"></p>').join('')+
   '<p class="bad" id="result-feedback" role="status"></p>';
}
const toolState={calculator:false,keypad:false,left:'',right:'',operation:'+',output:''};
function boardTools(){
 const keys=['1','2','3','4','5','6','7','8','9','0','−',',','/','␣','⌫','Další pole'];
 return '<div class="board-tools">'+
   '<details id="calculator-tool" '+(toolState.calculator?'open':'')+'><summary aria-label="Kalkulačka" title="Kalkulačka"><span aria-hidden="true">🧮</span></summary>'+
     '<div class="tool-panel"><h3>Kalkulačka</h3><form id="calculator-form" class="calculator-form">'+
     '<input id="calc-left" type="text" inputmode="decimal" maxlength="30" aria-label="První číslo">'+
     '<select id="calc-operation" aria-label="Početní operace"><option>+</option><option>−</option><option>×</option><option>÷</option></select>'+
     '<input id="calc-right" type="text" inputmode="decimal" maxlength="30" aria-label="Druhé číslo">'+
     '<button type="submit" aria-label="Vypočítat">=</button><output id="calc-output" aria-live="polite"></output></form></div></details>'+
   '<details id="keypad-tool" '+(toolState.keypad?'open':'')+'><summary aria-label="Numerická klávesnice" title="Numerická klávesnice"><span aria-hidden="true">⌨</span></summary>'+
     '<div class="tool-panel"><h3>Numerická klávesnice</h3><div class="board-keypad">'+keys.map(key=>
       '<button type="button" data-key="'+key+'"'+(key==='⌫'?' aria-label="Smazat znak"':key==='␣'?' aria-label="Mezera"':'')+'>'+key+'</button>'
     ).join('')+'</div><p class="minor" id="keypad-status" role="status"></p></div></details></div>';
}
function bindBoardTools(){
 for(const name of ['calculator','keypad']){
   const panel=root.querySelector('#'+name+'-tool');
   panel.ontoggle=()=>{toolState[name]=panel.open;};
 }
 const left=root.querySelector('#calc-left'), right=root.querySelector('#calc-right');
 const operation=root.querySelector('#calc-operation'), output=root.querySelector('#calc-output');
 const fields=[left,right,...root.querySelectorAll('.answer-fields input')];
 let active=null;
 fields.forEach(field=>field.onfocus=()=>{active=field;});
 left.value=toolState.left;
 right.value=toolState.right;
 operation.value=toolState.operation;
 output.textContent=toolState.output;
 left.oninput=()=>{toolState.left=left.value;};
 right.oninput=()=>{toolState.right=right.value;};
 operation.onchange=()=>{toolState.operation=operation.value;};
 root.querySelector('#calculator-form').onsubmit=event=>{
   event.preventDefault();
   const a=resultValue(left.value), b=resultValue(right.value);
   const x=a?Number(a[0])/Number(a[1]):NaN, y=b?Number(b[0])/Number(b[1]):NaN;
   const result={'+':()=>x+y,'−':()=>x-y,'×':()=>x*y,'÷':()=>x/y}[operation.value]();
   toolState.output=Number.isFinite(result)?String(Number(result.toPrecision(12))).replace('.',','):'Zkontroluj čísla a dělení nulou.';
   output.textContent=toolState.output;
 };
 const status=root.querySelector('#keypad-status');
 root.querySelectorAll('[data-key]').forEach(button=>{
   button.onpointerdown=event=>event.preventDefault();
   button.onclick=()=>{
     const key=button.dataset.key;
     if(!active||active.disabled){
       status.textContent='Nejdřív vyber pole, do kterého chceš psát.';
       return;
     }
     status.textContent='';
     if(key==='Další pole'){
       const group=fields.slice(active===left||active===right?0:2,active===left||active===right?2:fields.length);
       group[(group.indexOf(active)+1)%group.length].focus();
       return;
     }
     const start=active.selectionStart, end=active.selectionEnd;
     if(key==='⌫'){
       active.setRangeText('',start===end?Math.max(0,start-1):start,end,'end');
     }else{
       const text=key==='␣'?' ':key==='−'?'-':key;
       if(active.value.length-(end-start)+text.length>active.maxLength) return;
       active.setRangeText(text,start,end,'end');
     }
     active.dispatchEvent(new Event('input',{bubbles:true}));
     active.focus({preventScroll:true});
   };
 });
}
function fitCaseScreen(){
 const screen=root.querySelector('.case-screen');
 if(!screen) return;
 screen.style.zoom='';
 const tracks=[...screen.querySelectorAll('.calculation-track')];
 for(const track of tracks) track.style.zoom='';
 if(!window.matchMedia('(min-width: 850px)').matches) return;
 for(const track of tracks){
   const row=track.parentElement;
   const style=getComputedStyle(row);
   const available=row.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
   if(track.scrollWidth>available) track.style.zoom=(available-2)/track.scrollWidth;
 }
 const availableHeight=document.documentElement.clientHeight-screen.getBoundingClientRect().top-8;
 const height=screen.getBoundingClientRect().height;
 if(height>availableHeight) screen.style.zoom=Math.max(1,availableHeight-2)/height;
}
let fitFrame=0;
function scheduleFit(){
 cancelAnimationFrame(fitFrame);
 fitFrame=requestAnimationFrame(fitCaseScreen);
}
const caseChanges=new MutationObserver(scheduleFit);
caseChanges.observe(root,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['open']});
window.addEventListener('resize',scheduleFit);
function render(){
 const isGood = selected==='correct';
 const hasError = current.category && selected===String(firstBadIndex(current));
 const mayCorrect = hasError && choice===current.category;
 root.innerHTML=`
   <div class="case-screen">
   <div class="head">
     <div><div class="tasktype">DETEKTIVNÍ KANCELÁŘ · ${modeName} · ${{easy:'Lehká',medium:'Střední',hard:'Těžká'}[level]}</div>
       <h2>Případ ${index+1} z 15</h2></div>
     <button id="back" class="soft">← Výběr obtížnosti</button>
   </div>
   <div class="progress"><div class="bar" style="width:${Math.round(index/15*100)}%"></div></div>
   <section class="box assignment equation ${level==='hard'?'long-equation':''}" aria-label="Příklad a výpočet"><div class="calculation-track">${equation()}</div></section>
   <label class="check"><input id="correct" type="checkbox" ${isGood?'checked':''}><span>Celý postup je správný</span></label>
   <p class="minor" id="selection-feedback" role="status"></p>
   ${hasError?'<fieldset class="box error-types"><legend>V čem je chyba?</legend><div class="types">'+Object.entries(labels).map(([key,label])=>
     '<label class="type"><input type="radio" name="error-type" data-type="'+key+'" '+(choice===key?'checked':'')+'> '+label+'</label>'
   ).join('')+'</div><p class="minor" id="type-feedback" role="status">'+(choice&&!mayCorrect?'Zkus jinou možnost.':'')+'</p></fieldset>':''}
   ${isGood||mayCorrect?
     '<section class="box answer-fields">'+(mayCorrect?resultFields(current):'')+
     '<div class="controls"><button class="primary" id="submit" disabled>Odevzdat odpověď</button></div></section>':''}
   ${boardTools()}
   <div id="feedback"></div>
   </div>`;
 bindBoardTools();
 fitCaseScreen();
 root.querySelector('#back').onclick=menu;
 root.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{
   if(!current.category||button.dataset.step!==String(firstBadIndex(current))){
     root.querySelector('#selection-feedback').textContent='Zkus jiné místo ve výpočtu.';
     return;
   }
   if(hasError) return;
   selected=button.dataset.step;
   render();
   root.querySelector('[data-type]')?.focus({preventScroll:true});
 });
 root.querySelector('#correct').onchange=event=>{
   if(current.category){
     event.target.checked=false;
     root.querySelector('#selection-feedback').textContent='V postupu je chyba.';
     return;
   }
   selected=event.target.checked?'correct':'';
   render();
   root.querySelector(isGood?'#correct':'#submit')?.focus({preventScroll:true});
 };
 root.querySelectorAll('[data-type]').forEach(option=>option.onchange=()=>{
   choice=option.dataset.type;
   render();
   root.querySelector(choice===current.category?(repairSteps(current).length?'[data-repair]':'#fix'):'[data-type="'+choice+'"]')?.focus({preventScroll:true});
 });
 const inp=root.querySelector('#fix'), denominator=root.querySelector('#fix-denominator'), whole=root.querySelector('#fix-whole'), btn=root.querySelector('#submit');
 if(!btn) return;
 const repairInputs=[...root.querySelectorAll('[data-repair]')];
 function updateSubmit(){
   const complete=denominator
     ? /^-?\d+$/.test(inp.value.trim())&&/^\d+$/.test(denominator.value.trim())&&/[1-9]/.test(denominator.value)
     : fix.trim();
   const repaired=repairInputs.every(input=>/^\d+$/.test(input.value.trim())&&
     (!input.dataset.repair.endsWith('-bottom')||/[1-9]/.test(input.value)));
   btn.disabled=!(isGood||(complete&&repaired&&(!whole||/^\d+$/.test(whole.value.trim()))));
 }


 for(const input of repairInputs){
   const key=input.dataset.repair;
   input.value=stepEntries[key]||'';
   input.oninput=()=>{
     stepEntries[key]=input.value.trim();
     root.querySelector('#repair-feedback-'+key.split('-')[0]).textContent='';
     updateSubmit();
   };
 }
 if(inp){
   if(denominator){
     const [top,bottom='']=fix.split('/');
     const [wholeValue,numerator]=whole?top.split(' '):['',top];
     if(whole) whole.value=wholeValue;
     inp.value=numerator||'';
     denominator.value=bottom;
   }else{
     inp.value=fix;
   }
   const readResult=()=>{
     fix=denominator?(whole?whole.value.trim()+' ':'')+inp.value.trim()+'/'+denominator.value.trim():inp.value;
     inp.removeAttribute('aria-invalid');
     denominator?.removeAttribute('aria-invalid');
     root.querySelector('#result-feedback').textContent='';
     updateSubmit();
   };

   if(denominator) denominator.oninput=readResult;
   if(whole) whole.oninput=readResult;
 }
 updateSubmit();
 btn.onclick=submit;
}
function submit(){
 if(submitted)return;
 const located=(current.category===null?selected==='correct':selected===String(firstBadIndex(current)));
 const typed=(!current.category&&selected==='correct')||(current.category&&choice===current.category);
 if(!located||!typed||root.querySelector('#submit').disabled) return;
 const repaired=current.category?repairSteps(current):[];
 const wrongStep=repaired.findIndex((step,i)=>!repairMatches(step,i));
 if(wrongStep!==-1){
   root.querySelector('#repair-feedback-'+wrongStep).textContent='Zkontroluj čitatele a jmenovatele v kroku '+(firstBadIndex(current)+wrongStep)+'.';
   root.querySelector('[data-repair="'+wrongStep+'-0-top"]').focus();
   return;
 }
 const exactFinal=!repaired.length||!current.correction.startsWith('[[')||
   fix.split(/([ /])/).map(value=>/^\d+$/.test(value)?String(BigInt(value)):value).join('')===current.correction.slice(2,-2).replace(';',' ');
 if(current.category&&(!correctResult(current,fix)||!exactFinal)){
   const input=root.querySelector('#fix');

   root.querySelector('#fix-denominator')?.setAttribute('aria-invalid','true');

 }
 submitted=true;
 const correct=true;
 const data={id:current.id,steps:current.steps,instruction:current.instruction,targetUnit:current.targetUnit,located,typed,choice,selected,fix,repaired,category:current.category,correction:current.correction,explanation:current.explanation,correct};
 answers.push(data);
 if(!correct)countErrors++;
 const fb=root.querySelector('#feedback');
 fb.innerHTML=(mode==='test'?'<div class="notice">Odpověď uložena. Vyhodnocení se zobrazí po dokončení všech 15 případů.</div>':'<div class="notice '+(correct?'':'warn')+'"><b>'+(correct?'Místo a typ jsou správně.':'Tvoje označení není úplně správně.')+'</b><p>'+(current.category?'První chybný krok je číslo '+(firstBadIndex(current))+'. Typ: '+labels[current.category]+'.':'Celý postup je správný.')+'</p><p>'+current.explanation+'</p>'+(current.category?'<p>Správný výsledek: <b>'+math(current.correction)+'</b></p>':'')+'<p class="minor">Svůj výsledek můžeš porovnat se vzorem.</p></div>');
 const next=document.createElement('button');next.className='primary';next.textContent=index===14?'Zobrazit vyhodnocení':'Další případ →';next.onclick=()=>{index++;show()};fb.append(next);
 root.querySelectorAll('.step,[data-type],[data-repair],#correct,#fix,#fix-denominator,#fix-whole,#submit').forEach(x=>x.disabled=true);
 if(mode==='student'&&countErrors>=5){const note=document.createElement('p');note.className='notice warn';note.textContent='Pět nesprávně označených případů. Podle pravidel režimu ŽÁK můžeš začít nové kolo.';fb.append(note);}
}
function firstBadIndex(t){
 // V generovaných chybných případech je první chybný člen druhý, s výjimkou jednotek,
 // kde je chybný výsledek až ve třetím členu.
 return t.badIndex??(t.category==='units'?2:1);
}
function summary(){
 const scored=answers.filter(a=>a.correct).length;
 root.innerHTML='<div class="box"><div class="tasktype">DETEKTIVNÍ KANCELÁŘ · '+modeName+'</div><h1>Vyšetřování dokončeno</h1><div class="score">'+scored+' / 15</div><p>Zkontrolováno bylo místo a druh chyby i opravený výsledek.</p><div class="controls"><button class="primary" id="again">Nová sada 15 případů</button><button class="soft" id="levels">Změnit obtížnost</button><button class="soft" id="print">Vytisknout přehled</button></div><h2>Protokol případů</h2>'+answers.map((a,i)=>'<div class="summary"><b>'+(i+1)+'. '+(a.correct?'✓':'✗')+' '+(a.category?labels[a.category]:'Bez chyby')+'</b><p>'+a.instruction+' <span class="math">'+assignmentMath(a)+'</span></p><p class="small">Postup <span class="math">'+math(a.steps[0])+a.steps.slice(1).map((value,i)=>value===a.steps[i]?'':' = '+math(value)).join('')+'</span></p>'+(a.repaired.length?'<p><b>Opravené kroky</b> '+a.repaired.map(math).join(' = ')+'</p>':'')+(a.fix?'<p><b>Výsledek žáka:</b> '+escapeHTML(a.fix)+'</p>':'')+'<p><b>Vzor:</b> '+a.explanation+(a.category?' Správně: '+math(a.correction):'')+'</p></div>').join('')+'</div>';
 root.querySelector('#again').onclick=()=>start(level);
 root.querySelector('#levels').onclick=menu;
 root.querySelector('#print').onclick=()=>window.print();
 try{localStorage.setItem('zlomkov-detektiv-posledni',JSON.stringify({date:new Date().toISOString(),level,mode,answers}));}catch(e){}
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
menu();
</script></body></html>
